name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout VortyLib
        uses: actions/checkout@v4
        with:
          repository: Vortianski/VortyLib
          ref: 1.21.1
          path: vortylib-template-1.21.1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        env:
          VORTYLIB_PATH: vortylib-template-1.21.1
        run: ./gradlew build