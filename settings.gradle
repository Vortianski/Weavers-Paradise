pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

def vortyLibPath = System.getenv("VORTYLIB_PATH") ?: "../vortylib-template-1.21.1"

includeBuild(vortyLibPath)

def chaosLibPath = System.getenv("CHAOSLIB_PATH")

if (chaosLibPath) {
    includeBuild(chaosLibPath)
} else if (file("../chaoslib-1.21.1").exists()) {
    includeBuild("../chaoslib-1.21.1")
}